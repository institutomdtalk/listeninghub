<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listening Hub — MD Talk</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy:      #0B1D3A;
  --navy-deep: #050D1A;
  --navy-mid:  #0F2645;
  --navy-light:#163158;
  --gold:      #C4A45A;
  --gold-light:#D4BA7A;
  --gold-pale: #E8D9B0;
  --cream:     rgba(255,255,255,.92);
  --muted:     rgba(255,255,255,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:#07111f;
  color:var(--cream);
  font-family:'Raleway',sans-serif;
  font-weight:300;
  min-height:100vh;
  overflow-x:hidden;
  user-select:none;
}

/* ── BG ── */
#bgWrap{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
#bgImg{position:absolute;inset:-40px;background-size:cover;background-position:right center;background-repeat:no-repeat;}
#bgDim{position:absolute;inset:0;background:rgba(5,13,26,.72);}
#pageContent{position:relative;z-index:10;}

/* ── HEADER ── */
.site-header{
  padding:2.8rem 2.5rem 1.5rem;
  max-width:700px;margin:0 auto;text-align:center;
}
.eyebrow{
  font-size:8.5px;font-weight:600;letter-spacing:.28em;
  text-transform:uppercase;color:var(--gold);
  margin-bottom:1rem;opacity:.85;
}
.header-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2.8rem,6vw,4.2rem);
  font-weight:300;line-height:1;
  color:var(--cream);letter-spacing:-.02em;
}
.header-title em{color:var(--gold);font-style:italic;}
.header-sub{
  margin-top:.8rem;font-size:.75rem;font-weight:300;
  color:var(--muted);line-height:1.7;letter-spacing:.02em;
}
.header-rule{
  margin-top:1.8rem;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.4;
}

/* ── CATEGORY TABS ── */
.cat-tabs{
  display:flex;align-items:center;justify-content:center;
  gap:.6rem;padding:1.4rem 2rem .8rem;
  flex-wrap:wrap;
}
.cat-tab{
  background:transparent;
  border:1px solid rgba(196,164,90,.25);
  color:var(--muted);
  font-family:'Raleway',sans-serif;
  font-size:.66rem;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;
  padding:.4rem 1.1rem;border-radius:100px;
  cursor:pointer;transition:all .2s ease;
}
.cat-tab:hover{border-color:var(--gold);color:var(--gold);}
.cat-tab.active{background:var(--gold);border-color:var(--gold);color:var(--navy-deep);}

/* ── CAROUSEL STAGE ── */
.carousel-section{margin-bottom:3rem;}
.carousel-label{
  text-align:center;
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.3rem,2.5vw,1.8rem);
  font-weight:300;font-style:italic;color:var(--gold);
  margin-bottom:1.8rem;
  letter-spacing:.02em;
  text-shadow:0 0 30px rgba(196,164,90,.3);
}
.carousel-wrap{
  position:relative;
  height:420px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
/* nav arrows */
.carr-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  z-index:20;
  background:rgba(5,13,26,.6);
  border:1px solid rgba(196,164,90,.3);
  color:var(--gold);
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s ease;
  backdrop-filter:blur(4px);
}
.carr-arrow:hover{background:rgba(196,164,90,.15);border-color:var(--gold);}
.carr-arrow.prev{left:.8rem;}
.carr-arrow.next{right:.8rem;}
.carr-arrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}

/* ── ALBUM CARDS ── */
.carr-track{
  position:relative;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}
.album-card{
  position:absolute;
  width:260px;
  cursor:pointer;
  transition:transform .5s cubic-bezier(.4,0,.2,1),
             opacity .5s cubic-bezier(.4,0,.2,1),
             filter .5s cubic-bezier(.4,0,.2,1),
             box-shadow .5s ease;
  transform-origin:center center;
  border-radius:16px;
  overflow:hidden;
}
/* cover art */
.album-cover{
  width:100%;
  aspect-ratio:1/1;
  background:linear-gradient(135deg,var(--navy-mid) 0%,var(--navy-deep) 100%);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  overflow:hidden;
}
.album-cover::before{
  content:'';
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 30% 30%, rgba(196,164,90,.15) 0%, transparent 60%),
    radial-gradient(circle at 70% 70%, rgba(11,29,58,.8) 0%, transparent 60%);
}
.album-art-num{
  font-family:'Cormorant Garamond',serif;
  font-size:5rem;font-weight:300;
  color:rgba(196,164,90,.2);
  line-height:1;position:relative;z-index:1;
}
.album-cat-badge{
  position:absolute;top:.75rem;right:.75rem;
  font-size:7px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--navy-deep);background:var(--gold);
  padding:.2rem .55rem;border-radius:2px;
  z-index:2;
}
/* vinyl shine */
.album-shine{
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.08) 0%,transparent 50%,rgba(0,0,0,.1) 100%);
  pointer-events:none;z-index:3;
}

/* album info below cover */
.album-info{
  background:rgba(5,13,26,.92);
  backdrop-filter:blur(8px);
  padding:.9rem 1.1rem .75rem;
  border-top:1px solid rgba(196,164,90,.15);
}
.album-title{
  font-family:'Cormorant Garamond',serif;
  font-size:1rem;font-weight:400;
  color:var(--cream);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.album-desc{
  font-size:.65rem;font-weight:300;
  color:var(--muted);margin-top:.3rem;
  display:-webkit-box;-webkit-line-clamp:1;
  -webkit-box-orient:vertical;overflow:hidden;
  letter-spacing:.02em;
}

/* CARD STATES */
/* active — center */
.album-card.state-active{
  transform:translateX(0) scale(1) rotateY(0deg);
  opacity:1;
  filter:none;
  z-index:10;
  box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(196,164,90,.3);
}
/* prev-1 */
.album-card.state-prev1{
  transform:translateX(-220px) scale(.78) rotateY(12deg);
  opacity:.55;filter:brightness(.7) blur(.5px);z-index:7;
}
/* prev-2 */
.album-card.state-prev2{
  transform:translateX(-360px) scale(.62) rotateY(18deg);
  opacity:.25;filter:brightness(.5) blur(1px);z-index:5;
}
/* next-1 */
.album-card.state-next1{
  transform:translateX(220px) scale(.78) rotateY(-12deg);
  opacity:.55;filter:brightness(.7) blur(.5px);z-index:7;
}
/* next-2 */
.album-card.state-next2{
  transform:translateX(360px) scale(.62) rotateY(-18deg);
  opacity:.25;filter:brightness(.5) blur(1px);z-index:5;
}
/* hidden */
.album-card.state-hidden{
  transform:translateX(500px) scale(.5);
  opacity:0;pointer-events:none;z-index:1;
}
.album-card.state-hidden-left{
  transform:translateX(-500px) scale(.5);
  opacity:0;pointer-events:none;z-index:1;
}

/* ── DOTS indicator ── */
.carr-dots{
  display:flex;align-items:center;justify-content:center;
  gap:.4rem;margin-top:1.2rem;flex-wrap:wrap;
  padding:0 1rem;
  max-width:300px;margin-left:auto;margin-right:auto;
}
.carr-dot{
  width:5px;height:5px;border-radius:50%;
  background:rgba(196,164,90,.3);
  transition:all .3s ease;cursor:pointer;flex-shrink:0;
}
.carr-dot.active{background:var(--gold);transform:scale(1.4);}

/* ── PLAYER PANEL ── */
.player-panel{
  max-width:480px;margin:1rem auto 0;
  padding:0 1.5rem;
}
.now-playing-label{
  text-align:center;
  font-size:8px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold);opacity:.7;margin-bottom:1rem;
}
.np-title{
  text-align:center;
  font-family:'Cormorant Garamond',serif;
  font-size:1.35rem;font-weight:400;
  color:var(--cream);line-height:1.3;
  margin-bottom:.2rem;min-height:1.8rem;
}
.np-cat{
  text-align:center;font-size:.68rem;font-weight:300;
  color:var(--muted);letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:1.4rem;
}
/* progress */
.sp-bar-wrap{
  position:relative;height:4px;
  background:rgba(255,255,255,.12);
  border-radius:100px;cursor:pointer;margin-bottom:.5rem;
}
.sp-bar-fill{
  height:100%;background:var(--gold);
  border-radius:100px;width:0%;
  transition:width .1s linear;pointer-events:none;
}
.sp-bar-thumb{
  position:absolute;top:50%;left:0%;
  transform:translate(-50%,-50%);
  width:13px;height:13px;
  background:var(--gold-light);border:2px solid rgba(255,255,255,.9);
  border-radius:50%;pointer-events:none;
  opacity:0;transition:opacity .15s;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.sp-bar-wrap:hover .sp-bar-thumb{opacity:1;}
.sp-times{
  display:flex;justify-content:space-between;
  font-size:.62rem;font-weight:400;color:var(--muted);
  letter-spacing:.04em;font-variant-numeric:tabular-nums;
  margin-bottom:1.4rem;
}
/* controls */
.sp-controls{
  display:flex;align-items:center;justify-content:center;gap:1.5rem;
  margin-bottom:1rem;
}
.sp-btn-sm{
  background:none;border:none;cursor:pointer;
  color:var(--muted);transition:color .15s,transform .15s;
  display:flex;align-items:center;
}
.sp-btn-sm:hover{color:var(--cream);transform:scale(1.1);}
.sp-btn-sm svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.sp-btn-play{
  width:54px;height:54px;border-radius:50%;
  background:var(--gold);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .15s;
  box-shadow:0 4px 20px rgba(196,164,90,.35);
}
.sp-btn-play:hover{background:var(--gold-light);transform:scale(1.06);}
.sp-btn-play:active{transform:scale(.95);}
.sp-btn-play svg{width:20px;height:20px;fill:var(--navy-deep);stroke:none;}
/* speed & status */
.sp-meta{
  display:flex;align-items:center;justify-content:space-between;
}
.sp-status{
  font-size:.65rem;font-style:italic;color:var(--muted);
}
.sp-spd{
  font-family:'Raleway',sans-serif;
  font-size:.62rem;font-weight:700;letter-spacing:.1em;
  color:var(--muted);background:transparent;
  border:1px solid rgba(255,255,255,.18);
  border-radius:4px;padding:.12rem .5rem;
  cursor:pointer;transition:all .15s;
}
.sp-spd:hover{border-color:var(--gold);color:var(--gold);}

/* ── TRANSCRIPT PANEL ── */
.tx-section{
  max-width:540px;margin:1.5rem auto 0;
  padding:0 1.5rem 3rem;
}
.tx-toggle{
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  background:transparent;
  border:1px solid rgba(196,164,90,.25);
  color:var(--muted);
  font-family:'Raleway',sans-serif;
  font-size:.63rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  padding:.42rem 1.2rem;border-radius:100px;
  cursor:pointer;transition:all .2s ease;
  margin:0 auto .8rem;display:flex;
}
.tx-toggle:hover{border-color:var(--gold);color:var(--gold);}
.tx-toggle.open{border-color:rgba(255,255,255,.3);color:var(--cream);}
.tx-toggle svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .25s;}
.tx-toggle.open svg{transform:rotate(180deg);}
.tx-body{
  display:none;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(196,164,90,.15);
  border-radius:10px;padding:1.1rem 1.3rem;
  border-left:3px solid var(--gold);
}
.tx-body.open{display:block;}
.tx-label{font-size:8px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:.7rem;}
.tx-text{font-size:.77rem;font-weight:300;color:rgba(255,255,255,.72);line-height:1.9;white-space:pre-wrap;}

/* ── VOCAB AI BUTTON (inline) ── */
.vocab-trigger{
  display:block;
  margin:1rem auto 0;
  background:transparent;
  border:1px solid rgba(196,164,90,.3);
  color:var(--gold);
  font-family:'Raleway',sans-serif;
  font-size:.65rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  padding:.45rem 1.3rem;border-radius:100px;
  cursor:pointer;transition:all .2s;
}
.vocab-trigger:hover{background:rgba(196,164,90,.1);}

/* ── STATES ── */
.state-container{padding:4rem 0;text-align:center;}
.spinner{width:30px;height:30px;border:1.5px solid rgba(255,255,255,.1);border-top-color:var(--gold);border-radius:50%;animation:spin .75s linear infinite;margin:0 auto 1rem;}
.state-text{font-size:.78rem;font-weight:300;color:var(--muted);letter-spacing:.08em;}
.empty-glyph{font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:300;color:rgba(196,164,90,.15);margin-bottom:.75rem;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── REVEAL ── */
[data-reveal]{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease;}
[data-reveal].visible{opacity:1;transform:translateY(0);}

/* ── FOOTER ── */
.site-footer{
  text-align:center;padding:1.5rem;
  font-size:.64rem;font-weight:300;letter-spacing:.1em;
  color:rgba(255,255,255,.2);
  border-top:1px solid rgba(196,164,90,.12);
}
.site-footer strong{color:rgba(196,164,90,.4);font-weight:400;}

/* ── VOCAB MODAL ── */
.vocab-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(5,13,26,.65);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:1.5rem;}
.vocab-overlay.open{display:flex;}
.vocab-modal{background:#FDFAF4;border:1px solid rgba(196,164,90,.28);border-radius:16px;width:100%;max-width:560px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 28px 80px rgba(0,0,0,.45);}
.vocab-modal-header{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 1.5rem 1rem;border-bottom:1px solid rgba(11,29,58,.07);flex-shrink:0;}
.vocab-modal-title{display:flex;align-items:center;gap:.6rem;}
.vocab-modal-title svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.vocab-modal-title span{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:400;color:var(--navy-deep);}
.vocab-modal-sub{font-size:.67rem;font-weight:300;color:rgba(11,29,58,.38);margin-top:.1rem;}
.vocab-modal-close{background:none;border:none;cursor:pointer;color:rgba(11,29,58,.38);font-size:1.2rem;padding:.25rem .4rem;border-radius:4px;transition:color .15s;}
.vocab-modal-close:hover{color:var(--navy-deep);}
.vocab-chat{flex:1;overflow-y:auto;padding:1rem 1.5rem;display:flex;flex-direction:column;gap:.85rem;}
.vocab-msg{max-width:92%;font-size:.78rem;font-weight:300;line-height:1.7;}
.vocab-msg.user{align-self:flex-end;background:var(--navy);color:var(--gold-pale);padding:.55rem .95rem;border-radius:12px 12px 2px 12px;font-weight:400;}
.vocab-msg.ai{align-self:flex-start;background:rgba(11,29,58,.05);color:var(--navy-deep);padding:.75rem 1rem;border-radius:2px 12px 12px 12px;border-left:2px solid var(--gold);white-space:pre-wrap;}
.vocab-msg.ai strong{font-weight:600;color:var(--navy-deep);}
.vocab-msg.thinking{align-self:flex-start;color:rgba(11,29,58,.38);font-style:italic;font-size:.72rem;}
.vocab-input-row{display:flex;gap:.6rem;padding:.9rem 1.5rem 1.1rem;border-top:1px solid rgba(11,29,58,.07);flex-shrink:0;}
.vocab-input{flex:1;background:rgba(11,29,58,.04);border:1px solid rgba(11,29,58,.12);border-radius:8px;color:var(--navy-deep);font-family:'Raleway',sans-serif;font-size:.78rem;font-weight:300;padding:.6rem .95rem;outline:none;transition:border-color .2s;}
.vocab-input:focus{border-color:var(--gold);}
.vocab-input::placeholder{color:rgba(11,29,58,.38);}
.vocab-send{background:var(--navy);border:none;border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.vocab-send:hover{background:#163158;}
.vocab-send svg{width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

@media(max-width:600px){
  .site-header{padding:2rem 1.5rem 1.2rem;}
  .carr-arrow.prev{left:.2rem;} .carr-arrow.next{right:.2rem;}
  .album-card{width:200px;}
  .album-card.state-prev1{transform:translateX(-165px) scale(.75) rotateY(10deg);}
  .album-card.state-next1{transform:translateX(165px) scale(.75) rotateY(-10deg);}
  .album-card.state-prev2{transform:translateX(-280px) scale(.6) rotateY(15deg);}
  .album-card.state-next2{transform:translateX(280px) scale(.6) rotateY(-15deg);}
  .carousel-wrap{height:360px;}
  .player-panel{padding:0 1rem;}
}
</style>
</head>
<body>

<div id="bgWrap">
  <div id="bgImg"></div>
  <div id="bgDim"></div>
</div>

<div id="pageContent">

<header class="site-header">
  <p class="eyebrow">Instituto MD Talk &nbsp;·&nbsp; TMEP</p>
  <h1 class="header-title">Listening <em>Hub</em></h1>
  <p class="header-sub">Acervo de áudios para praticar seu inglês. Use ← → ou deslize para navegar entre as faixas.</p>
  <div class="header-rule"></div>
</header>

<div class="cat-tabs" id="catTabs">
  <button class="cat-tab active" data-cat="all">All</button>
</div>

<main id="mainContent">
  <div class="state-container">
    <div class="spinner"></div>
    <p class="state-text">Loading audio library…</p>
  </div>
</main>

<footer class="site-footer">
  <strong>MD Talk</strong> &nbsp;·&nbsp; Listening Hub &nbsp;·&nbsp; All rights reserved
</footer>

</div><!-- /pageContent -->

<!-- VOCAB MODAL -->
<div class="vocab-overlay" id="vocabOverlay" onclick="handleOverlayClick(event)">
  <div class="vocab-modal">
    <div class="vocab-modal-header">
      <div>
        <div class="vocab-modal-title">
          <svg viewBox="0 0 24 24"><path d="M12 2a8 8 0 0 1 8 8c0 3.5-2 6.5-5 7.9V20a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-2.1C6 16.5 4 13.5 4 10a8 8 0 0 1 8-8z"/><path d="M9 10h.01M12 10h.01M15 10h.01"/></svg>
          <span>Vocabulary AI</span>
        </div>
        <p class="vocab-modal-sub">Type any word or phrase from the audio</p>
      </div>
      <button class="vocab-modal-close" onclick="closeVocabModal()">&#x2715;</button>
    </div>
    <div class="vocab-chat" id="vocabChat"></div>
    <div class="vocab-input-row">
      <input class="vocab-input" id="vocabInput" type="text" placeholder="e.g. amyloidosis, shortness of breath…" autocomplete="off">
      <button class="vocab-send" onclick="sendVocabQuery()">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxAjBvDp7lCOOVbtyJaoiRulKf0GoDFgsLZj4W6Rc6kLawC4ITZSwXzsBVsd17hZd6Bbw/exec';
const CAT_LABELS = { regular:'Regular English', medical:'Medical English', business:'Business English' };
const CAT_ORDER  = ['regular','medical','business'];

let allAudios    = [];
let filtered     = [];
let activeFilter = 'all';
let currentIdx   = 0;
let currentAudio = null;
let isPlaying    = false;

/* ══ FETCH ══ */
async function loadAudios() {
  const main = document.getElementById('mainContent');
  try {
    main.innerHTML = '<div class="state-container"><div class="spinner"></div><p class="state-text">Connecting to library…</p></div>';
    const res  = await fetch(SHEET_URL + '?type=audios&t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e) { throw new Error('JSON error: ' + text.slice(0,120)); }
    if (data.error) throw new Error(data.error);
    if (!Array.isArray(data)) throw new Error('Not an array');
    allAudios = data.filter(r => r.title && r.drive_file_id).map(r => ({
      ...r,
      drive_file_id: extractDriveId(r.drive_file_id),
      category: normCategory(r.category),
    })).filter(r => r.drive_file_id);
    if (!allAudios.length) throw new Error('0 valid tracks');
    buildTabs();
    applyFilter('all');
  } catch(err) {
    main.innerHTML = `<div class="state-container"><div class="empty-glyph">&#9671;</div>
      <p class="state-text"><strong style="color:#c4614a">Error:</strong> ${err.message}</p></div>`;
  }
}

/* ══ TABS ══ */
function buildTabs() {
  const tabs = document.getElementById('catTabs');
  const cats = CAT_ORDER.filter(c => allAudios.some(a => a.category === c));
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-tab';
    btn.dataset.cat = cat;
    btn.textContent = CAT_LABELS[cat] || cat;
    btn.addEventListener('click', () => applyFilter(cat));
    tabs.appendChild(btn);
  });
  tabs.querySelector('[data-cat="all"]').addEventListener('click', () => applyFilter('all'));
}

function applyFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  filtered = cat === 'all' ? [...allAudios] : allAudios.filter(a => a.category === cat);
  currentIdx = 0;
  // stop all playing audio
  Object.values(carrState).forEach(st => { if (st.audio) { st.audio.pause(); st.audio.src=""; } });
  renderCarousel();
}

/* ══ CAROUSEL RENDER ══ */
function renderCarousel() {
  const main = document.getElementById('mainContent');
  if (!filtered.length) {
    main.innerHTML = '<div class="state-container"><div class="empty-glyph">&#9671;</div><p class="state-text">No tracks in this category.</p></div>';
    return;
  }

  // Group by category for separate carousels, or single if filtered
  if (activeFilter === 'all') {
    const groups = {};
    filtered.forEach(a => { (groups[a.category] = groups[a.category]||[]).push(a); });
    const sorted = CAT_ORDER.filter(c => groups[c]);
    main.innerHTML = sorted.map(cat => buildCarouselSection(cat, groups[cat], `carr_${cat}`)).join('');
  } else {
    main.innerHTML = buildCarouselSection(activeFilter, filtered, 'carr_main');
  }

  // Init all carousels
  document.querySelectorAll('.carousel-section').forEach(sec => {
    const id = sec.dataset.carrid;
    initCarousel(id);
  });

  observeReveal();
}

function buildCarouselSection(cat, items, carrid) {
  const label = CAT_LABELS[cat] || cat.charAt(0).toUpperCase() + cat.slice(1);
  const cards = items.map((a, i) => buildAlbumCard(a, i, carrid)).join('');
  const dots  = items.map((_, i) => `<span class="carr-dot${i===0?' active':''}" data-carrid="${carrid}" data-idx="${i}" onclick="goTo('${carrid}',${i})"></span>`).join('');

  return `
  <section class="carousel-section" data-reveal data-carrid="${carrid}" data-items='${JSON.stringify(items.map(a=>({...a,transcript:a.transcript||''})))}'>
    <p class="carousel-label">${label}</p>
    <div class="carousel-wrap">
      <button class="carr-arrow prev" onclick="shift('${carrid}',-1)">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="carr-track" id="track_${carrid}">${cards}</div>
      <button class="carr-arrow next" onclick="shift('${carrid}',1)">
        <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
    </div>
    <div class="carr-dots" id="dots_${carrid}">${dots}</div>

    <!-- Player panel for this carousel -->
    <div class="player-panel" id="pp_${carrid}">
      <p class="now-playing-label">Now Playing</p>
      <p class="np-title" id="npt_${carrid}">${esc(items[0].title)}</p>
      <p class="np-cat"  id="npc_${carrid}">${label}</p>
      <div class="sp-bar-wrap" id="bar_${carrid}" onclick="spSeek(this,'${carrid}')">
        <div class="sp-bar-fill" id="fill_${carrid}"></div>
        <div class="sp-bar-thumb" id="thumb_${carrid}"></div>
      </div>
      <div class="sp-times">
        <span id="tcur_${carrid}">0:00</span>
        <span id="tdur_${carrid}">0:00</span>
      </div>
      <div class="sp-controls">
        <button class="sp-btn-sm" onclick="shift('${carrid}',-1)" title="Previous">
          <svg viewBox="0 0 24 24"><polygon points="19,20 9,12 19,4"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        </button>
        <button class="sp-btn-play" id="playbtn_${carrid}" onclick="spToggle('${carrid}')" aria-label="Play">
          <svg class="sp-play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
          <svg class="sp-pause" viewBox="0 0 24 24" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button class="sp-btn-sm" onclick="shift('${carrid}',1)" title="Next">
          <svg viewBox="0 0 24 24"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
      </div>
      <div class="sp-meta">
        <span class="sp-status" id="status_${carrid}">Click play to load</span>
        <button class="sp-spd" id="spd_${carrid}" onclick="spSpeed('${carrid}')">1×</button>
      </div>
    </div>

    <!-- Transcript -->
    <div class="tx-section">
      <button class="tx-toggle" id="txtog_${carrid}" onclick="toggleTx('${carrid}')">
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        Transcript
      </button>
      <div class="tx-body" id="txbody_${carrid}">
        <p class="tx-label">Transcript</p>
        <p class="tx-text" id="txtext_${carrid}">${esc(items[0].transcript||'')}</p>
      </div>
      <button class="vocab-trigger" onclick="openVocabModal('${cat}')">Vocabulary AI</button>
    </div>
  </section>`;
}

function buildAlbumCard(a, i, carrid) {
  const catLabel = CAT_LABELS[a.category] || a.category;
  const num = String(i+1).padStart(2,'0');
  const state = i === 0 ? 'state-active' : i === 1 ? 'state-next1' : i === 2 ? 'state-next2' : 'state-hidden';
  return `<div class="album-card ${state}" data-idx="${i}" data-carrid="${carrid}" onclick="cardClick('${carrid}',${i})">
    <div class="album-cover">
      <span class="album-art-num">${num}</span>
      <span class="album-cat-badge">${catLabel}</span>
      <div class="album-shine"></div>
    </div>
    <div class="album-info">
      <p class="album-title">${esc(a.title)}</p>
      ${a.description ? `<p class="album-desc">${esc(a.description)}</p>` : ''}
    </div>
  </div>`;
}

/* ══ CAROUSEL STATE ══ */
const carrState = {}; // carrid → { idx, audio, loaded, playing, speeds }

function initCarousel(carrid) {
  carrState[carrid] = { idx: 0, audio: null, loaded: false, playing: false, speedIdx: 0 };
  updateCarousel(carrid, 0);

  // Swipe
  const wrap = document.getElementById('track_' + carrid);
  if (!wrap) return;
  let startX = 0, startT = 0;
  wrap.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startT = Date.now(); }, {passive:true});
  wrap.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dt = Date.now() - startT;
    if (Math.abs(dx) > 40 && dt < 400) shift(carrid, dx < 0 ? 1 : -1);
  }, {passive:true});
}

function getItems(carrid) {
  const sec = document.querySelector(`[data-carrid="${carrid}"]`);
  if (!sec) return [];
  try { return JSON.parse(sec.dataset.items); } catch{ return []; }
}

function updateCarousel(carrid, newIdx) {
  const items  = getItems(carrid);
  if (!items.length) return;
  const st = carrState[carrid];
  st.idx = newIdx;

  // Update card states
  const cards = document.querySelectorAll(`[data-carrid="${carrid}"].album-card`);
  cards.forEach(card => {
    const ci = parseInt(card.dataset.idx);
    const d  = ci - newIdx;
    card.className = 'album-card ' + (
      d ===  0 ? 'state-active'  :
      d ===  1 ? 'state-next1'   :
      d ===  2 ? 'state-next2'   :
      d === -1 ? 'state-prev1'   :
      d === -2 ? 'state-prev2'   :
      d < 0    ? 'state-hidden-left' : 'state-hidden'
    );
  });

  // Update dots
  document.querySelectorAll(`[data-carrid="${carrid}"].carr-dot`).forEach(d => {
    d.classList.toggle('active', parseInt(d.dataset.idx) === newIdx);
  });

  // Update player info
  const a = items[newIdx];
  if (!a) return;
  const npt = document.getElementById('npt_' + carrid);
  const npc = document.getElementById('npc_' + carrid);
  if (npt) npt.textContent = a.title;
  if (npc) npc.textContent = CAT_LABELS[a.category] || a.category;

  // Update transcript
  const txtext = document.getElementById('txtext_' + carrid);
  if (txtext) txtext.textContent = a.transcript || '(No transcript available)';

  // Reset transcript toggle
  const txbody = document.getElementById('txbody_' + carrid);
  const txtog  = document.getElementById('txtog_' + carrid);
  if (txbody) { txbody.classList.remove('open'); }
  if (txtog)  { txtog.classList.remove('open'); }

  // Reset player if track changed
  if (st.audio) {
    st.audio.pause();
    st.audio.src = '';
  }
  st.audio = null;
  st.loaded = false;
  st.playing = false;
  spSyncBtn(carrid, false);
  const fill  = document.getElementById('fill_'  + carrid);
  const tcur  = document.getElementById('tcur_'  + carrid);
  const tdur  = document.getElementById('tdur_'  + carrid);
  const status= document.getElementById('status_' + carrid);
  if (fill)   fill.style.width = '0%';
  if (tcur)   tcur.textContent = '0:00';
  if (tdur)   tdur.textContent = '0:00';
  if (status) status.textContent = 'Click play to load';
}

function shift(carrid, dir) {
  const items = getItems(carrid);
  const st    = carrState[carrid];
  if (!items.length) return;
  const newIdx = Math.max(0, Math.min(items.length - 1, st.idx + dir));
  if (newIdx === st.idx) return;
  updateCarousel(carrid, newIdx);
}

function goTo(carrid, idx) {
  const st = carrState[carrid];
  if (st && st.idx !== idx) updateCarousel(carrid, idx);
}

function cardClick(carrid, idx) {
  const st = carrState[carrid];
  if (!st) return;
  if (st.idx !== idx) { updateCarousel(carrid, idx); return; }
  // already active — toggle play
  spToggle(carrid);
}

/* ══ PLAYER ══ */
const SP_SPEEDS = [1, 1.25, 1.5, 0.75];

async function spToggle(carrid) {
  const st    = carrState[carrid];
  const items = getItems(carrid);
  if (!st || !items.length) return;
  const a = items[st.idx];

  if (st.playing && st.audio && !st.audio.paused) {
    st.audio.pause();
    st.playing = false;
    spSyncBtn(carrid, false);
    return;
  }

  const status = document.getElementById('status_' + carrid);

  if (!st.audio || !st.loaded) {
    if (status) status.textContent = 'Loading…';
    if (!st.audio) {
      st.audio = new Audio();
      const spd = document.getElementById('spd_' + carrid);
      if (spd) st.audio.playbackRate = SP_SPEEDS[st.speedIdx||0];
      st.audio.addEventListener('timeupdate', () => spUpdate(carrid));
      st.audio.addEventListener('ended', () => { st.playing=false; spSyncBtn(carrid,false); });
      st.audio.addEventListener('error', () => { if(status) status.textContent='Error loading audio'; });
    }

    try {
      const proxyUrl = SHEET_URL + '?type=audioblob&id=' + a.drive_file_id;
      const res  = await fetch(proxyUrl);
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      const bin  = atob(json.b64);
      const arr  = new Uint8Array(bin.length);
      for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      const blob = new Blob([arr], {type: json.mime||'audio/mpeg'});
      st.audio.src = URL.createObjectURL(blob);
      st.loaded = true;
      const tdur = document.getElementById('tdur_' + carrid);
      st.audio.addEventListener('loadedmetadata', () => {
        if (tdur) tdur.textContent = spFmt(st.audio.duration);
      });
    } catch(err) {
      if (status) status.textContent = 'Could not load: ' + err.message;
      return;
    }
  }

  try {
    await st.audio.play();
    st.playing = true;
    spSyncBtn(carrid, true);
    if (status) status.textContent = '';
  } catch(e) {
    if (status) status.textContent = 'Playback error';
  }
}

function spSyncBtn(carrid, playing) {
  const btn = document.getElementById('playbtn_' + carrid);
  if (!btn) return;
  btn.querySelector('.sp-play').style.display  = playing ? 'none'  : 'block';
  btn.querySelector('.sp-pause').style.display = playing ? 'block' : 'none';
}

function spUpdate(carrid) {
  const st   = carrState[carrid];
  if (!st || !st.audio) return;
  const pct  = st.audio.duration ? (st.audio.currentTime/st.audio.duration)*100 : 0;
  const fill  = document.getElementById('fill_'  + carrid);
  const thumb = document.getElementById('thumb_' + carrid);
  const tcur  = document.getElementById('tcur_'  + carrid);
  if (fill)  fill.style.width = pct + '%';
  if (thumb) thumb.style.left = pct + '%';
  if (tcur)  tcur.textContent = spFmt(st.audio.currentTime);
}

function spSeek(bar, carrid) {
  const st = carrState[carrid];
  if (!st || !st.audio || !st.audio.duration) return;
  const rect = bar.getBoundingClientRect();
  st.audio.currentTime = ((event.clientX - rect.left) / rect.width) * st.audio.duration;
}

function spSpeed(carrid) {
  const st  = carrState[carrid];
  const btn = document.getElementById('spd_' + carrid);
  if (!st || !btn) return;
  st.speedIdx = ((st.speedIdx||0) + 1) % SP_SPEEDS.length;
  if (st.audio) st.audio.playbackRate = SP_SPEEDS[st.speedIdx];
  btn.textContent = SP_SPEEDS[st.speedIdx] + '×';
}

function spFmt(s) {
  if (!s || isNaN(s)) return '0:00';
  return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
}

/* ══ TRANSCRIPT ══ */
function toggleTx(carrid) {
  const body = document.getElementById('txbody_' + carrid);
  const tog  = document.getElementById('txtog_'  + carrid);
  if (!body) return;
  const open = body.classList.toggle('open');
  if (tog) tog.classList.toggle('open', open);
}

/* ══ KEYBOARD NAV ══ */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const secs = document.querySelectorAll('.carousel-section');
  if (!secs.length) return;
  // Navigate the first visible carousel (simplest UX)
  const carrid = secs[0].dataset.carrid;
  if (e.key === 'ArrowLeft')  shift(carrid, -1);
  if (e.key === 'ArrowRight') shift(carrid,  1);
  if (e.key === ' ') { e.preventDefault(); spToggle(carrid); }
});

/* ══ VOCAB AI ══ */
let vocabCategory = 'medical';
let vocabInputListenerAttached = false;

function openVocabModal(cat) {
  vocabCategory = cat || 'medical';
  document.getElementById('vocabOverlay').classList.add('open');
  const inp = document.getElementById('vocabInput');
  inp.focus();
  if (!vocabInputListenerAttached) {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') sendVocabQuery(); });
    vocabInputListenerAttached = true;
  }
  const chat = document.getElementById('vocabChat');
  if (!chat.innerHTML) {
    addAiMsg("Hello! I'm your Vocabulary AI. Type any word or expression you heard in the audio and I'll explain its meaning, clinical usage, and give you examples in context.");
  }
}
function closeVocabModal() { document.getElementById('vocabOverlay').classList.remove('open'); }
function handleOverlayClick(e) { if (e.target === document.getElementById('vocabOverlay')) closeVocabModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVocabModal(); });

function addUserMsg(text) {
  const chat = document.getElementById('vocabChat');
  const div = document.createElement('div');
  div.className = 'vocab-msg user'; div.textContent = text;
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
}
function addAiMsg(text) {
  const chat = document.getElementById('vocabChat');
  const div = document.createElement('div');
  div.className = 'vocab-msg ai';
  div.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
  return div;
}
function addThinking() {
  const chat = document.getElementById('vocabChat');
  const div = document.createElement('div');
  div.className = 'vocab-msg thinking'; div.id = 'vocabThinking'; div.textContent = 'Looking that up…';
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
}
function removeThinking() { const el = document.getElementById('vocabThinking'); if (el) el.remove(); }

async function sendVocabQuery() {
  const input = document.getElementById('vocabInput');
  const query = input.value.trim();
  if (!query) return;
  input.value = '';
  addUserMsg(query);
  addThinking();
  const catLabel = CAT_LABELS[vocabCategory] || vocabCategory;
  try {
    const vocabUrl = SHEET_URL + '?type=vocab&query=' + encodeURIComponent(query) + '&cat=' + encodeURIComponent(catLabel);
    const res  = await fetch(vocabUrl);
    const data = await res.json();
    removeThinking();
    if (data.error) throw new Error(data.error);
    addAiMsg(data.reply);
  } catch(err) {
    removeThinking();
    addAiMsg("Sorry, I couldn't reach the AI right now. Please try again.");
  }
}

/* ══ UTILS ══ */
function extractDriveId(raw) {
  if (!raw) return '';
  raw = raw.trim();
  if (!/[/?&]/.test(raw)) return raw;
  let m = raw.match(/\/file\/d\/([a-zA-Z0-9_-]+)/); if (m) return m[1];
  m = raw.match(/[?&]id=([a-zA-Z0-9_-]+)/); if (m) return m[1];
  m = raw.match(/\/d\/([a-zA-Z0-9_-]+)/); if (m) return m[1];
  return raw;
}
function normCategory(raw) {
  if (!raw) return 'medical';
  const v = raw.trim().toLowerCase();
  if (v==='medical'||v.includes('medic')||v.includes('neuro')||v.includes('cardio')||v.includes('onco')||v.includes('pedia')||v.includes('psych')||v.includes('surg')||v.includes('clini')||v.includes('health')||v.includes('pharm')||v.includes('anat')||v.includes('physio')||v.includes('patho')||v.includes('radio')) return 'medical';
  if (v==='business'||v.includes('busi')||v.includes('corpo')||v.includes('finan')||v.includes('market')||v.includes('manage')) return 'business';
  if (v==='regular'||v.includes('reg')||v.includes('general')||v.includes('every')||v.includes('daily')||v.includes('convers')) return 'regular';
  return 'medical';
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function observeReveal() {
  const obs = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, {threshold:.05});
  document.querySelectorAll('[data-reveal]').forEach(el => obs.observe(el));
}

loadAudios();
</script>
